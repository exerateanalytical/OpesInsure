components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://identity.example.com/oauth/authorize
          tokenUrl: https://identity.example.com/oauth/token
          scopes:
            opesinsure: OpesInsure API access
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 255
    TenantHeader:
      name: X-Tenant-ID
      in: header
      required: true
      schema:
        type: string
  schemas:
    Envelope:
      type: object
      properties:
        data: {}
        meta:
          type: object
          additionalProperties: true
    Problem:
      type: object
      required:
      - title
      - status
      - code
      - correlation_id
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        field_errors:
          type: object
          additionalProperties: true
        correlation_id:
          type: string
  responses:
    Unauthorized:
      description: Authentication required
    Forbidden:
      description: Not authorized
    ValidationError:
      description: Validation or business-rule error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
