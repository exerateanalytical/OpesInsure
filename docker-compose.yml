services:
  api:
    build: .
    working_dir: /var/www/html
    volumes: [".:/var/www/html"]
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: php artisan serve --host=0.0.0.0 --port=8080
  worker:
    build: .
    working_dir: /var/www/html
    volumes: [".:/var/www/html"]
    depends_on: [api]
    command: php artisan horizon
  scheduler:
    build: .
    working_dir: /var/www/html
    volumes: [".:/var/www/html"]
    depends_on: [api]
    command: php artisan schedule:work
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: opesinsure
      POSTGRES_USER: opesinsure
      POSTGRES_PASSWORD: change-me
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U opesinsure"], interval: 5s, timeout: 5s, retries: 10}
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: ["redis-data:/data"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
  minio:
    image: minio/minio:latest
    environment: {MINIO_ROOT_USER: opesinsure, MINIO_ROOT_PASSWORD: change-me}
    command: server /data --console-address :9001
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
volumes:
  postgres-data:
  redis-data:
  minio-data:
